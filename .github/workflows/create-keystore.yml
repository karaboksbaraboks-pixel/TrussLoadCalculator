name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore trussload-release.jks \
            -alias trussload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass TrussLoad2026Key \
            -keypass TrussLoad2026Key \
            -dname "CN=TrussLoad Calculator, OU=Android, O=TrussLoad, L=Tallinn, C=EE"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: trussload-keystore
          path: trussload-release.jks
          if-no-files-found: error
